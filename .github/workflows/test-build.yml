name: Test build (no publish)

# Проверочная сборка рабочих веток: тесты + APK во вкладке Actions.
# Ничего не публикует: нет выпуска «latest», нет зеркала GitVerse — игроки обновление не получат.
on:
  workflow_dispatch:
  push:
    # Все ветки сессий ccr-*, кроме основной линии (её собирает и публикует android.yml).
    branches: [ "ccr-*", "!ccr-30f02f17-ph3ie4" ]
    paths-ignore: [ "telegram/**", "plans/**", "promo/**", "docs/**" ]

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Prepare LibretroDroid sources (KAPSULA patch)
        run: tools/libretrodroid/setup.sh

      - name: Prepare J2ME Loader sources (KAPSULA patch)
        run: tools/j2me/setup.sh

      # те же ядра и системные файлы, что в android.yml — иначе APK не запустит игры
      - name: Fetch libretro cores and system files
        run: |
          set -euo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets/ppsspp
          curl -fsSL --retry 4 -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/ppsspp_libretro_android.so.zip
          unzip -p core.zip ppsspp_libretro_android.so > app/src/main/jniLibs/arm64-v8a/libppsspp_libretro_android.so
          for c in pcsx_rearmed armsx2 clownmdemu gearsystem fceumm flycast yabasanshiro geargrafx geolith mednafen_ngp mednafen_wswan stella prosystem gearlynx; do
            curl -fsSL --retry 4 -o core-$c.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/${c}_libretro_android.so.zip
            unzip -p core-$c.zip ${c}_libretro_android.so > app/src/main/jniLibs/arm64-v8a/lib${c}_libretro_android.so
          done
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/ARMSX2/ARMSX2.git armsx2-src
          (cd armsx2-src && git sparse-checkout set bin/resources)
          mkdir -p app/src/main/assets/pcsx2
          (cd armsx2-src/bin/resources && zip -qr -9 ../../../app/src/main/assets/pcsx2/resources.zip . -x "*.psd")
          curl -fsSL --retry 4 -o app/src/main/assets/ppsspp/PPSSPP.zip https://buildbot.libretro.com/assets/system/PPSSPP.zip
          CORE_SHA=$(sha256sum app/src/main/jniLibs/arm64-v8a/libppsspp_libretro_android.so | cut -c1-16)
          echo "PPSSPP libretro · buildbot nightly $(date -u +%Y-%m-%d) · sha256 ${CORE_SHA}" > app/src/main/assets/ppsspp/CORE.txt

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore

      # ключ KAPSULA из секретов — APK ставится поверх установленной версии, без удаления и потери данных
      - name: Restore release signing key
        env:
          KEYSTORE_B64: ${{ secrets.KAPSULA_KEYSTORE_B64 }}
          KEY_PASS: ${{ secrets.KAPSULA_KEY_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEY_PASS" ]; then echo "::error::Нет секретов KAPSULA_KEYSTORE_B64 / KAPSULA_KEY_PASS"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kapsula.jks"
          echo "KAPSULA_KEYSTORE=$RUNNER_TEMP/kapsula.jks" >> "$GITHUB_ENV"
          echo "KAPSULA_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload APK (only in this run, not published)
        uses: actions/upload-artifact@v4
        with:
          name: kapsula-test-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::Тесты не прошли — отчёт в артефакте test-reports. APK собран, но ставить его стоит только после разбора."
          exit 1
