name: Build NEXUS PSP APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ccr-30f02f17-ph3ie4" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Restore stable signing key
        run: |
          base64 --decode nexus-debug.keystore.b64 > nexus-debug.keystore

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-psp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk nexus.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nexus.apk --prerelease --target "$GITHUB_SHA" \
            --title "NEXUS — последняя сборка" \
            --notes "Сборка ${GITHUB_SHA::7} из ветки ${GITHUB_REF_NAME}"
