<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#0b0c0f;font-family:Manrope,sans-serif;color:#f2f1ec}
  .grid{display:grid;grid-template-columns:844px 844px;gap:28px 24px;padding:28px}
  .cap{font-weight:800;font-size:18px;margin:0 0 8px 4px;display:flex;gap:10px;align-items:baseline}
  .cap small{font-weight:600;font-size:13px;color:#8e9099}
  svg{display:block;border-radius:18px}
</style>
<script src="../ui/img/ctl/icons.js"></script><!-- для просмотра: icons.js собирается из ui/img/ctl/*.png -->
</head><body><div class="grid" id="g"></div>
<script>
const AMBER='#D9B36C',BLUE='#7FA7D9',GREEN='#8FC9A3',ROSE='#D98A8A',IVORY='#F2F1EC';
const W=844,H=390;
let uid=0;
function scene(kind){
  // абстрактная «игровая» сцена: небо, горы, дорога — чтобы проверить читаемость кнопок
  const s={psp:['#2a3550','#7a5a6a','#d79a6a'],ps1:['#1f2b2a','#3c5a4a','#8fae7a'],ps2:['#1d2238','#3a3f6a','#9a8fd0'],touch:['#26323f','#4f6a7a','#c9b08a']}[kind];
  return `<defs><linearGradient id="sky${kind}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s[0]}"/><stop offset=".62" stop-color="${s[1]}"/><stop offset="1" stop-color="${s[2]}"/></linearGradient>
  <filter id="bl${kind}"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
  <rect width="${W}" height="${H}" fill="url(#sky${kind})"/>
  <g filter="url(#bl${kind})" opacity=".9">
   <circle cx="610" cy="120" r="46" fill="#fff" opacity=".18"/>
   <path d="M0 250 L120 170 L230 230 L360 140 L470 220 L600 160 L720 230 L844 180 L844 390 L0 390Z" fill="#000" opacity=".28"/>
   <path d="M0 300 L180 250 L330 290 L520 240 L700 290 L844 260 L844 390 L0 390Z" fill="#000" opacity=".35"/>
   <path d="M360 390 L410 262 L434 262 L484 390Z" fill="#000" opacity=".25"/>
   <rect x="400" y="200" width="44" height="64" rx="8" fill="#000" opacity=".3"/>
  </g>`;
}
// ---------- «физические» элементы классики ----------
function defsCap(){
  return `<defs>
   <radialGradient id="capG" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#4a4d57"/><stop offset=".55" stop-color="#23252c"/><stop offset="1" stop-color="#141519"/></radialGradient>
   <radialGradient id="knobG" cx=".4" cy=".32" r=".85"><stop offset="0" stop-color="#55585f"/><stop offset=".6" stop-color="#2a2c33"/><stop offset="1" stop-color="#16171b"/></radialGradient>
   <linearGradient id="dpG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3d46"/><stop offset="1" stop-color="#1a1b20"/></linearGradient>
   <linearGradient id="shG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#43464f"/><stop offset="1" stop-color="#1b1c21"/></linearGradient>
   <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".55"/></filter>
  </defs>`;
}
function glyph(t,x,y,r,c){
  const k=r*.42,sw=Math.max(2.6,r*.085);
  if(t==='tri'){const h=k*1.0;return `<path d="M${x} ${y-h} L${x+h*1.05} ${y+h*.72} L${x-h*1.05} ${y+h*.72}Z" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linejoin="round"/>`}
  if(t==='cir')return `<circle cx="${x}" cy="${y}" r="${k*.82}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
  if(t==='crs'){const a=k*.78;return `<path d="M${x-a} ${y-a} L${x+a} ${y+a} M${x+a} ${y-a} L${x-a} ${y+a}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round"/>`}
  const a=k*.72;return `<rect x="${x-a}" y="${y-a}" width="${a*2}" height="${a*2}" rx="${a*.12}" fill="none" stroke="${c}" stroke-width="${sw}"/>`;
}
function cap(x,y,r,c,t,pressed){
  return `<g filter="url(#sh)">
   <circle cx="${x}" cy="${y}" r="${r}" fill="#0c0d10" opacity=".55"/>
   <circle cx="${x}" cy="${y-1}" r="${r-2.5}" fill="url(#capG)" stroke="${c}" stroke-opacity=".55" stroke-width="1.6"/>
   <ellipse cx="${x-r*.18}" cy="${y-r*.42}" rx="${r*.46}" ry="${r*.2}" fill="#fff" opacity=".09"/>
   ${pressed?`<circle cx="${x}" cy="${y}" r="${r+5}" fill="none" stroke="${c}" stroke-width="3" opacity=".8"/><circle cx="${x}" cy="${y-1}" r="${r-3}" fill="${c}" opacity=".22"/>`:''}
   ${glyph(t,x,y-1,r,c)}</g>`;
}
function face(cx,cy,gap,r,press){
  return cap(cx,cy-gap,r,AMBER,'tri')+cap(cx+gap,cy,r,BLUE,'cir',press)+cap(cx,cy+gap,r,GREEN,'crs')+cap(cx-gap,cy,r,ROSE,'sqr');
}
function dpad(cx,cy,s){
  const a=s*.17,b=s*.5,rr=s*.06;
  const p=`M${cx-a} ${cy-b+rr} q0 -${rr} ${rr} -${rr} h${2*a-2*rr} q${rr} 0 ${rr} ${rr} V${cy-a} H${cx+b-rr} q${rr} 0 ${rr} ${rr} v${2*a-2*rr} q0 ${rr} -${rr} ${rr} H${cx+a} V${cy+b-rr} q0 ${rr} -${rr} ${rr} h-${2*a-2*rr} q-${rr} 0 -${rr} -${rr} V${cy+a} H${cx-b+rr} q-${rr} 0 -${rr} -${rr} v-${2*a-2*rr} q0 -${rr} ${rr} -${rr} H${cx-a}Z`;
  const tri=(x,y,dx,dy)=>{const k=s*.055;return `<path d="M${x+dx*k} ${y+dy*k} L${x-dy*k-dx*k*.2} ${y+dx*k-dy*k*.2} L${x+dy*k-dx*k*.2} ${y-dx*k-dy*k*.2}Z" fill="${IVORY}" opacity=".55"/>`};
  return `<g filter="url(#sh)"><circle cx="${cx}" cy="${cy}" r="${b+8}" fill="#000" opacity=".22"/>
  <path d="${p}" fill="url(#dpG)" stroke="#fff" stroke-opacity=".14" stroke-width="1.2"/>
  <circle cx="${cx}" cy="${cy}" r="${a*.62}" fill="#000" opacity=".35"/>
  ${tri(cx,cy-b*.72,0,-1)}${tri(cx,cy+b*.72,0,1)}${tri(cx-b*.72,cy,-1,0)}${tri(cx+b*.72,cy,1,0)}</g>`;
}
function stick(cx,cy,r,label,knobDx=0,knobDy=0){
  const kx=cx+knobDx,ky=cy+knobDy,kr=r*.56;let rings='';
  for(let i=1;i<=3;i++)rings+=`<circle cx="${kx}" cy="${ky-1}" r="${kr*(.28+i*.18)}" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="1.2"/>`;
  return `<g filter="url(#sh)"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#0c0d10" opacity=".5" stroke="#fff" stroke-opacity=".12"/>
  <circle cx="${cx}" cy="${cy}" r="${r*.8}" fill="none" stroke="#fff" stroke-opacity=".06" stroke-dasharray="2 5"/>
  <circle cx="${kx}" cy="${ky}" r="${kr}" fill="url(#knobG)" stroke="#fff" stroke-opacity=".18"/>${rings}
  ${label?`<text x="${kx}" y="${ky+4}" text-anchor="middle" font-size="11" font-weight="800" fill="${IVORY}" opacity=".5">${label}</text>`:''}</g>`;
}
function nub(cx,cy){ // PSP: плоская «таблетка» в лунке
  return `<g filter="url(#sh)"><ellipse cx="${cx}" cy="${cy}" rx="46" ry="40" fill="#0c0d10" opacity=".5" stroke="#fff" stroke-opacity=".12"/>
  <ellipse cx="${cx}" cy="${cy-1}" rx="26" ry="23" fill="url(#knobG)" stroke="#fff" stroke-opacity=".2"/>
  <ellipse cx="${cx}" cy="${cy-1}" rx="17" ry="14" fill="none" stroke="#fff" stroke-opacity=".1"/>
  <ellipse cx="${cx-5}" cy="${cy-9}" rx="10" ry="4" fill="#fff" opacity=".08"/></g>`;
}
function shoulder(x,y,w,h,right,label,curve=true){
  const r=h*.5,cv=curve?h*.9:0;
  const p=right?`M${x} ${y+h} L${x} ${y+r} Q${x} ${y} ${x+r} ${y} L${x+w-cv} ${y} Q${x+w} ${y} ${x+w} ${y+h} Z`
               :`M${x+w} ${y+h} L${x+w} ${y+r} Q${x+w} ${y} ${x+w-r} ${y} L${x+cv} ${y} Q${x} ${y} ${x} ${y+h} Z`;
  return `<g filter="url(#sh)"><path d="${p}" fill="url(#shG)" stroke="#fff" stroke-opacity=".16" stroke-width="1.2"/>
  <text x="${x+w/2}" y="${y+h/2+6}" text-anchor="middle" font-size="16" font-weight="800" fill="${IVORY}" opacity=".85">${label}</text></g>`;
}
function trigger(x,y,w,h,right,label){
  const p=right?`M${x} ${y+h} L${x} ${y+12} Q${x} ${y} ${x+12} ${y} L${x+w-18} ${y} Q${x+w} ${y+4} ${x+w} ${y+h*.6} L${x+w-6} ${y+h} Z`
               :`M${x+w} ${y+h} L${x+w} ${y+12} Q${x+w} ${y} ${x+w-12} ${y} L${x+18} ${y} Q${x} ${y+4} ${x} ${y+h*.6} L${x+6} ${y+h} Z`;
  return `<g filter="url(#sh)"><path d="${p}" fill="url(#shG)" stroke="#fff" stroke-opacity=".14" stroke-width="1.2" opacity=".92"/>
  <text x="${x+w/2}" y="${y+h/2+5}" text-anchor="middle" font-size="14" font-weight="800" fill="${IVORY}" opacity=".75">${label}</text></g>`;
}
function pill(x,y,label,w=46){
  return `<g filter="url(#sh)"><rect x="${x-w/2}" y="${y-9}" width="${w}" height="18" rx="9" fill="url(#shG)" stroke="#fff" stroke-opacity=".16"/>
  <text x="${x}" y="${y+24}" text-anchor="middle" font-size="9.5" font-weight="800" letter-spacing="1.2" fill="${IVORY}" opacity=".6">${label}</text></g>`;
}
function util(x,y,kind){ // служебные: ускорение, сохранить, загрузить, пауза — стекло
  let g='';
  if(kind==='pause')g=`<rect x="${x-5}" y="${y-7}" width="3.5" height="14" rx="1" fill="${IVORY}"/><rect x="${x+1.5}" y="${y-7}" width="3.5" height="14" rx="1" fill="${IVORY}"/>`;
  if(kind==='ff')g=`<path d="M${x-8} ${y-6} L${x} ${y} L${x-8} ${y+6}Z M${x} ${y-6} L${x+8} ${y} L${x} ${y+6}Z" fill="${IVORY}"/>`;
  if(kind==='save')g=`<path d="M${x} ${y-7} V${y+4} M${x-5} ${y-1} L${x} ${y+4} L${x+5} ${y-1}" stroke="${IVORY}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M${x-8} ${y+8} H${x+8}" stroke="${IVORY}" stroke-width="2.2" stroke-linecap="round"/>`;
  if(kind==='load')g=`<path d="M${x} ${y+5} V${y-6} M${x-5} ${y-1} L${x} ${y-6} L${x+5} ${y-1}" stroke="${IVORY}" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M${x-8} ${y+8} H${x+8}" stroke="${IVORY}" stroke-width="2.2" stroke-linecap="round"/>`;
  return `<circle cx="${x}" cy="${y}" r="17" fill="#000" opacity=".38" stroke="#fff" stroke-opacity=".18"/>${g}`;
}
function utilRow(cy){return util(W/2-66,cy,'ff')+util(W/2-22,cy,'save')+util(W/2+22,cy,'load')+util(W/2+66,cy,'pause')}

// ---------- KAPSULA Touch: игровые кнопки ----------
function tbtn(x,y,r,icon,opt={}){
  const c=opt.c||IVORY; let s='';
  s+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#0b0c10" opacity="${opt.main?.55:.42}"/>`;
  s+=`<circle cx="${x}" cy="${y}" r="${r-1}" fill="none" stroke="${c}" stroke-opacity="${opt.main?.7:.35}" stroke-width="${opt.main?2.4:1.6}"/>`;
  if(opt.hold){const C=2*Math.PI*(r+5);s+=`<circle cx="${x}" cy="${y}" r="${r+5}" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r+5}" fill="none" stroke="${c}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${C*.62} ${C}" transform="rotate(-90 ${x} ${y})"/>`}
  if(opt.press)s+=`<circle cx="${x}" cy="${y}" r="${r+6}" fill="none" stroke="${c}" stroke-width="3" opacity=".85"/><circle cx="${x}" cy="${y}" r="${r-2}" fill="${c}" opacity=".18"/>`;
  const k=r*(opt.main?1.05:1.1);
  s+=`<image href="${ICONS[icon]}" x="${x-k/2}" y="${y-k/2}" width="${k}" height="${k}" opacity=".95"/>`;
  if(opt.label)s+=`<text x="${x}" y="${y+r+15}" text-anchor="middle" font-size="10.5" font-weight="800" fill="${IVORY}" opacity=".65">${opt.label}</text>`;
  if(opt.count)s+=`<rect x="${x+r*.45}" y="${y-r-2}" width="26" height="16" rx="8" fill="${c}"/><text x="${x+r*.45+13}" y="${y-r+10}" text-anchor="middle" font-size="10" font-weight="800" fill="#0b0c0f">${opt.count}</text>`;
  return `<g filter="url(#sh)">${s}</g>`;
}

// ---------- раскладки ----------
const P={
 psp:()=>shoulder(16,14,150,40,false,'L')+shoulder(W-166,14,150,40,true,'R')+dpad(118,168,120)+nub(118,302)+face(W-120,182,54,27,true)+pill(W-150,352,'SELECT')+pill(W-90,352,'START')+utilRow(30),
 ps1:()=>trigger(16,10,96,34,false,'L2')+shoulder(16,50,128,36,false,'L1',false)+trigger(W-112,10,96,34,true,'R2')+shoulder(W-144,50,128,36,true,'R1',false)
   +dpad(124,212,140)+face(W-126,212,58,29)+pill(W/2-36,350,'SELECT')+pill(W/2+36,350,'START')+utilRow(30),
 ps2:()=>trigger(16,10,96,34,false,'L2')+shoulder(16,50,128,36,false,'L1',false)+trigger(W-112,10,96,34,true,'R2')+shoulder(W-144,50,128,36,true,'R1',false)
   +dpad(104,186,112)+face(W-106,196,50,25)+stick(234,300,58,'L3',10,-6)+stick(W-234,300,58,'R3')+pill(W/2-34,352,'SELECT')+pill(W/2+34,352,'START')+utilRow(30),
 touch:()=>{
   let s='';
   // плавающий стик: зона + подсказка
   s+=`<circle cx="150" cy="282" r="74" fill="#000" opacity=".16" stroke="#fff" stroke-opacity=".14" stroke-dasharray="3 7"/><circle cx="168" cy="268" r="34" fill="#fff" opacity=".14" stroke="#fff" stroke-opacity=".4" stroke-width="1.6"/>`;
   s+=`<text x="150" y="374" text-anchor="middle" font-size="10.5" font-weight="800" fill="${IVORY}" opacity=".5">ДВИЖЕНИЕ — КАСАНИЕ В ЛЮБОМ МЕСТЕ</text>`;
   s+=tbtn(W-104,284,50,'attack',{main:true,c:ROSE,press:true});
   s+=tbtn(W-206,318,32,'jump',{c:GREEN})+tbtn(W-196,224,32,'sprint',{c:AMBER,hold:true})+tbtn(W-110,176,32,'grab',{c:BLUE});
   s+=tbtn(W-286,262,26,'crouch')+tbtn(W-40,170,22,'combo');
   s+=tbtn(W-40,74,22,'car')+tbtn(W-96,74,22,'weapon',{count:'12'})+tbtn(40,74,22,'map')+tbtn(W/2,368,17,'pause');
   s+=tbtn(W-286,174,26,'aim');
   return s;
 }
};
const CAP={psp:['PSP · Классика','выбирается сама для игр PSP: L/R, крестовина, «таблетка»-стик, фигуры'],
 ps1:['PS1 · Классика','крупная крестовина, L1/L2/R1/R2; стики — только для игр с аналогом'],
 ps2:['PS2 · Классика','два стика (L3/R3 — нажатие на стик), L1/L2/R1/R2'],
 touch:['KAPSULA Touch','без кнопок джойстика: действия-пиктограммы, главная крупнее, стик где коснёшься']};
const g=document.getElementById('g');
for(const k of ['psp','ps1','ps2','touch']){
  const d=document.createElement('div');
  d.innerHTML=`<div class="cap">${CAP[k][0]} <small>${CAP[k][1]}</small></div><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${scene(k)}${defsCap()}${P[k]()}</svg>`;
  g.appendChild(d);
}
</script></body></html>
