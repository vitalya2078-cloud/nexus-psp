  <main class="inner">
    <div class="head"><img src="/img/mascot/wink.webp" alt="" width="{{MW}}" height="{{MH}}"><div><h1>{{sec.h1}}</h1><p>{{sec.lead}}</p></div></div>
    <div class="panel"><b class="js-total"></b><div class="meter"><i class="js-meter" style="width:0"></i></div><p class="hint">{{sec.local}}</p></div>
    <div class="panel js-reward" hidden><div class="note"><img src="/img/mascot/gift-open.webp" alt="" width="{{MW}}" height="{{MH}}"><div><h2>{{sec.reward}}</h2><p>{{sec.reward.d}}</p><p class="h js-rcode" style="font-size:28px;color:var(--honey)"></p><p class="hint">{{sec.reward.how}}</p></div></div></div>
    <div class="panel js-empty" hidden><div class="note"><img src="/img/mascot/magnifier.webp" alt="" width="{{MW}}" height="{{MH}}"><p>{{sec.empty}}</p></div></div>
    <h2>{{sec.ach}}</h2>
    <div class="cards js-ach" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))"></div>
    <p class="hint js-deep"></p>
    <h2 style="margin-top:26px">{{sec.book}}</h2>
    <p class="hint">{{sec.book.d}}</p>
    <div class="cards js-book" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))"></div>
    <h2 style="margin-top:26px">{{sec.hunt}}</h2>
    <p class="hint">{{sec.hunt.d}}</p>
    <div class="row js-carts" style="justify-content:flex-start"></div>
  </main>
