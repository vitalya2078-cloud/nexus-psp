  <main class="inner tool">
    <a class="back" href="{{L}}tools.html">← {{nav.tools}}</a>
    <div class="head"><img src="/img/mascot/think.webp" alt="" width="{{MW}}" height="{{MH}}"><div><h1>{{phone.h1}}</h1><p>{{phone.lead}}</p></div></div>
    <div class="panel">
      <p class="hint js-model">{{phone.where}}</p>
      <input class="field js-q" type="search" placeholder="{{phone.ph}}" autocomplete="off">
      <div class="list js-list" role="listbox"></div>
    </div>
    <div class="panel js-res" hidden>
      <h2 class="js-chip"></h2>
      <p class="hint js-tier"></p>
      <div class="grades js-grades"></div>
      <p class="hint">{{phone.note}}</p>
    </div>
  </main>
