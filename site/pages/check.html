  <main class="inner tool">
    <a class="back" href="{{L}}tools.html">← {{nav.tools}}</a>
    <div class="head"><img src="/img/mascot/magnifier.webp" alt="" width="{{MW}}" height="{{MH}}"><div><h1>{{check.h1}}</h1><p>{{check.lead}}</p></div></div>
    <div class="panel">
      <label class="drop js-drop">
        <input type="file" class="js-file" multiple>
        <b>{{check.pick}}</b>
        <span class="hint">{{check.types}}</span>
        <span class="hint">{{check.local}}</span>
      </label>
      <div class="js-out"></div>
    </div>
    <div class="panel">
      <h2>{{check.faq}}</h2>
      <p class="hint"><b>{{check.f1}}</b> {{check.f1a}}</p>
      <p class="hint"><b>{{check.f2}}</b> {{check.f2a}}</p>
    </div>
  </main>
