  <main class="inner" style="text-align:center;display:grid;justify-items:center;gap:8px">
    <img class="js-gpose" src="/img/mascot/gift.webp" alt="" width="{{MW}}" height="{{MH}}" style="width:min(240px,60vw)">
    <h1>{{gift.h1}}</h1>
    <p class="lead">{{gift.lead}}</p>
    <a class="btn big js-take" href="kapsula://gift/">{{gift.take}}</a>
    <p>{{gift.code}} <b class="js-code">—</b><br><span class="hint">{{gift.manual}}</span></p>
    <p class="hint">{{gift.noapp}} <a href="{{HOME}}">{{gift.get}}</a></p>
  </main>
