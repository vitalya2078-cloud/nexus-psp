<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121828">
<title>Моя полка — KAPSULA</title>
<meta name="description" content="Собери карточку своей ретро-полки: любимые приставки и игры — и поделись ей во ВКонтакте или Telegram.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="tools.css">
<style>
.shelf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.pick { display: grid; justify-items: center; gap: 4px; padding: 8px; border-radius: 14px; background: var(--s2); border: 2px solid transparent; color: var(--ink); cursor: pointer; font: 700 13px var(--head); }
.pick img { width: 70px; }
.pick.on { border-color: var(--acc); background: rgba(242,166,90,.12); }
.preview { width: 100%; border-radius: 16px; border: 1px solid var(--line2); box-shadow: 0 20px 40px rgba(0,0,0,.4); }
.form { display: grid; gap: 10px; }
@media (max-width: 820px) { .shelf-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="lamp" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="./"><img src="img/logo.svg" alt="" width="36" height="36"><span>KAPSULA</span></a>
  <nav><a href="./#tools">Полезное</a></nav>
  <a class="btn btn-main btn-sm" href="./#get">Скачать</a>
</header>
<main class="tool">
  <a class="back" href="./#tools">← Полезное</a>
  <div class="tool-head">
    <img src="img/mascot/cartbox.webp" alt="" width="321" height="311">
    <div><h1>Моя полка</h1><p>Собери карточку любимых приставок и игр — и поделись ей с друзьями.</p></div>
  </div>
  <div class="shelf-grid">
    <div class="panel form">
      <h2>Приставки <span class="hint js-cnt">(до 6)</span></h2>
      <div class="picks js-picks"></div>
      <h2>Обо мне</h2>
      <input class="field js-nick" maxlength="20" placeholder="Ник">
      <input class="field js-g1" maxlength="34" placeholder="Любимая игра">
      <input class="field js-g2" maxlength="34" placeholder="Ещё одна">
      <input class="field js-g3" maxlength="34" placeholder="И ещё одна">
    </div>
    <div class="panel">
      <h2>Карточка</h2>
      <canvas class="preview js-cv" width="1200" height="630"></canvas>
      <p class="qrow" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">
        <button class="btn btn-main js-share" type="button">Поделиться</button>
        <button class="btn btn-soft js-save" type="button">Скачать картинку</button>
      </p>
      <p class="hint">Картинка собирается на твоём устройстве и никуда не отправляется.</p>
    </div>
  </div>
</main>
<script src="data.js"></script>
<script src="shelf.js"></script>
<script src="menu.js" defer></script>
</body>
</html>
