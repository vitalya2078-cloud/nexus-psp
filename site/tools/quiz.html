<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121828">
<title>Ретро-викторина — KAPSULA</title>
<meta name="description" content="10 вопросов о ретро-приставках: угадай по силуэту, по году, по производителю. Поделись результатом с друзьями.">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="tools.css">
<style>
.qbox { display: grid; gap: 16px; justify-items: center; text-align: center; }
.qprog { display: flex; gap: 6px; }
.qprog i { width: 26px; height: 6px; border-radius: 3px; background: var(--s3); transition: background .3s; }
.qprog i.ok { background: #8fc9a3; } .qprog i.no { background: #e29a9a; } .qprog i.cur { background: var(--acc); }
.qpic { width: min(320px, 80vw); aspect-ratio: 3/2; display: grid; place-items: center; }
.qpic img { width: 100%; height: 100%; object-fit: contain; filter: brightness(0) drop-shadow(0 0 12px rgba(242,166,90,.55)); transition: filter .6s; }
.qpic.reveal img { filter: none; }
.qq { font: 700 clamp(22px, 4vw, 30px)/1.2 var(--head); margin: 0; }
.qopts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(560px, 100%); }
.qopt { min-height: 54px; padding: 10px; border-radius: 16px; border: 1px solid var(--line2); background: var(--s2); color: var(--ink); font: 700 17px var(--head); cursor: pointer; transition: transform .15s, background .2s, border-color .2s; }
.qopt:hover { border-color: var(--acc); transform: translateY(-2px); }
.qopt.right { background: rgba(143,201,163,.2); border-color: #8fc9a3; }
.qopt.wrong { background: rgba(226,154,154,.18); border-color: #e29a9a; animation: shake .35s; }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.qbuddy { width: 110px; }
.qscore { font: 700 64px/1 var(--head); color: var(--acc); }
.qrow { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<div class="lamp" aria-hidden="true"></div>
<header class="top">
  <a class="brand" href="./"><img src="img/logo.svg" alt="" width="36" height="36"><span>KAPSULA</span></a>
  <nav><a href="./#tools">Полезное</a></nav>
  <a class="btn btn-main btn-sm" href="./#get">Скачать</a>
</header>
<main class="tool">
  <a class="back" href="./#tools">← Полезное</a>
  <div class="panel"><div class="qbox js-quiz"></div></div>
</main>
<script src="data.js"></script>
<script src="quiz.js"></script>
<script src="menu.js" defer></script>
</body>
</html>
